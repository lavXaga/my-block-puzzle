name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Хитрый шаг: ищем, где именно лежит build.gradle, и заходим туда
    - name: Find project directory
      id: find-dir
      run: |
        if [ -f "build.gradle" ]; then
          echo "dir=." >> $GITHUB_OUTPUT
        elif [ -f "app/build.gradle" ]; then
          echo "dir=." >> $GITHUB_OUTPUT
        else
          # Ищем файл build.gradle на один уровень глубже
          DIR=$(find . -maxdepth 2 -name "build.gradle" | head -n 1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT
        fi

    - name: Build Debug APK
      run: gradle assembleDebug
      working-directory: ${{ steps.find-dir.outputs.dir }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: ${{ steps.find-dir.outputs.dir }}/app/build/outputs/apk/debug/*.apk
