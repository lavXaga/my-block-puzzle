name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Download Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        wget https://raw.githubusercontent.com/gradle/gradle/v8.0.2/gradlew -O gradlew
        wget https://raw.githubusercontent.com/gradle/gradle/v8.0.2/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        wget https://raw.githubusercontent.com/gradle/gradle/v8.0.2/gradle/wrapper/gradle-wrapper.properties -O gradle/wrapper/gradle-wrapper.properties
        chmod +x gradlew
      working-directory: ./Block-PuzzleProject

    # Этот шаг переименовывает файл игры, чтобы не было белого экрана
    - name: Rename index to index.html
      run: |
        if [ -f assets/index ]; then
          mv assets/index assets/index.html
          echo "Файл index успешно переименован в index.html"
        else
          echo "Файл assets/index не найден, возможно он уже переименован."
        fi
      working-directory: ./Block-PuzzleProject/app/src/main

    # Собираем проект с флагом --no-daemon и очисткой clean
    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon --stacktrace
      working-directory: ./Block-PuzzleProject

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: '**/*.apk'
